[build]
  publish = "site"
  command = "npm run build:netlify"

[dev]
  command = "npm run dev"
  targetPort = 43879
  port = 8888
  publish = "site"

[[redirects]]
  from = "/"
  to = "/harness/"
  status = 301
  force = true

[[headers]]
  for = "/harness/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/harness/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/harness/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/harness/images/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
